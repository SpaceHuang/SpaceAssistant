name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: CI / Full tests (macOS)
    runs-on: macos-latest
    # Full Vitest suite takes about 18 minutes on CI; leave room for macOS runner variance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 源文件 NUL 字节检查：只需 git 与 node，放在 npm ci 之前失败即秒级退出
      # （背景：Node 22 node:sqlite 按 NUL 截断读出字符串，字面 NUL 曾致 CI 与本地结果不一致）
      - name: Check source files for NUL bytes
        run: npm run check:no-nul
      # tree-sitter 受控 wasm/node-types 哈希校验：只需 node，与 check:no-nul 同层秒级失败
      - name: Check tree-sitter wasm hashes
        run: npm run check:treesitter-wasm
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Initialize Electron binary before test workers
        run: node scripts/initialize-electron-ci.mjs
      - name: Check required CI coverage
        run: npm run check:ci-required-coverage
      - name: Test required CI coverage checker
        run: node --test scripts/check-ci-required-coverage.test.mjs scripts/check-ci-required-results.test.mjs scripts/summarize-vitest-report.test.mjs scripts/ci-failure-review.test.mjs
      - name: Test local pre-push and critical-flow harnesses
        run: node --test scripts/check-pre-push.test.cjs scripts/pre-push-hook.integration.test.cjs scripts/run-critical-user-flows.test.cjs scripts/verify-critical-user-flow-faults.test.cjs
      - name: Summarize recorded CI failure reviews
        run: npm run check:ci-failure-review
      - run: npm run i18n:generate-types
      - run: npm run i18n:check
      - run: npm run typecheck:shared
      - run: npm run check:system-invariant-registry
      - run: npm run check:model-baseline
      - run: npm run typecheck:renderer
      # Agent SDK 包独立 tsconfig，独立于 Electron 主进程 typecheck。
      - run: npm run typecheck:agent-sdk
      # SDK 包边界和生产依赖闭包护栏。
      - run: npm run check:agent-sdk
      - name: Build app and verify six critical user flows
        run: npm run verify:critical-user-flows
      # SDK turn 与 Hosted Host 生命周期回归，不启动 Electron UI。
      - run: npm exec vitest run packages/agent-sdk/test/agentCore.test.ts packages/agent-sdk/test/turn.test.ts electron/runtime/hostedAgentTurnHost.test.ts
      - name: Prepare Vitest report directory
        run: mkdir -p .ci
      - name: Run full Vitest suite
        run: npm test -- --reporter=dot --reporter=json --outputFile=.ci/vitest-report.json
      - name: Summarize Vitest failures
        if: always()
        env:
          CI_PLATFORM: macOS ${{ runner.arch }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/summarize-vitest-report.mjs
      - name: Upload sanitized Vitest report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/vitest-summary.json
          retention-days: 14
          if-no-files-found: error
  storage-perf:
    name: CI / Storage performance (observation)
    runs-on: macos-latest
    # Storage performance is observational until R-03 is decided; do not add it to ci-required.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Test sanitized storage performance summarizer
        run: node --test scripts/summarize-storage-perf-report.test.mjs
      - run: npm run build:agent-provider-pi-ai
      - name: Prepare storage performance report directory
        run: mkdir -p .ci
      - name: Run storage performance regression lane
        run: npm run test:storage-perf -- --reporter=json --outputFile=.ci/storage-perf-report.json
      - name: Summarize selected storage performance results
        if: always()
        run: node scripts/summarize-storage-perf-report.mjs
      - name: Upload sanitized storage performance summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: storage-perf-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/storage-perf-summary.json
          retention-days: 14
          if-no-files-found: error
  chat_business_probe:
    name: CI / Chat business IPC probe (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
          - label: Windows
            runner: windows-latest
    env:
      SPACEASSISTANT_IPC_SAMPLES: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:electron
      - name: Initialize Electron binary before probe
        run: node scripts/initialize-electron-ci.mjs
      - name: Probe chat IPC business lifecycle
        run: npm run probe:chat-business-ipc
  golden_windows:
    name: CI / Shell golden (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run i18n:generate-types
      # Shell/Python Golden 基线在 win32 录制：路径判定语义与宿主平台耦合（P1-8），固定 windows 运行
      - run: npm exec vitest run electron/shell/shellGolden.test.ts electron/shell/scriptGolden.test.ts

  sqlite_windows_x64:
    name: CI / SQLite probe (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # 完整 Electron 主进程探针（node:sqlite 内嵌于 Electron，无需原生绑定）；
      # 不得设置 ELECTRON_RUN_AS_NODE，必须以真实 Electron 应用启动。
      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite

  sqlite_macos_x64:
    name: CI / SQLite probe (macOS x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite

  sqlite_macos_arm64:
    name: CI / SQLite probe (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite

  shell_windows_x64:
    name: CI / Shell contract (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Initialize Electron binary before test workers
        run: node scripts/initialize-electron-ci.mjs
      - run: npm run i18n:generate-types
      - run: npm run build:agent-provider-pi-ai
      - run: npm exec -- vitest run --project electron electron/confirmation/recursionGuard.test.ts electron/confirmation/toolCallGate.test.ts
      - run: npm run test:shell-lifecycle
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer

  shell_macos_x64:
    name: CI / Shell contract (macOS x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Initialize Electron binary before test workers
        run: node scripts/initialize-electron-ci.mjs
      - run: npm run i18n:generate-types
      - run: npm run build:agent-provider-pi-ai
      - run: npm exec -- vitest run --project electron electron/confirmation/recursionGuard.test.ts electron/confirmation/toolCallGate.test.ts
      - run: npm run test:shell-lifecycle
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer

  shell_macos_arm64:
    name: CI / Shell contract (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Electron 必须先由串行步骤解析、检查并启动，再运行任何 Vitest worker。
      - name: Initialize Electron binary before test workers
        run: node scripts/initialize-electron-ci.mjs
      - run: npm run i18n:generate-types
      - run: npm run build:agent-provider-pi-ai
      - run: npm exec -- vitest run --project electron electron/confirmation/recursionGuard.test.ts electron/confirmation/toolCallGate.test.ts
      - run: npm run test:shell-lifecycle
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer

  ci-required:
    name: required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
      - golden_windows
      - sqlite_windows_x64
      - sqlite_macos_x64
      - sqlite_macos_arm64
      - shell_windows_x64
      - shell_macos_x64
      - shell_macos_arm64
    steps:
      - uses: actions/checkout@v5
      - name: Summarize required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/check-ci-required-results.mjs
