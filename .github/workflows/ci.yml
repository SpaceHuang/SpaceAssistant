name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 源文件 NUL 字节检查：只需 git 与 node，放在 npm ci 之前失败即秒级退出
      # （背景：Node 22 node:sqlite 按 NUL 截断读出字符串，字面 NUL 曾致 CI 与本地结果不一致）
      - name: Check source files for NUL bytes
        run: npm run check:no-nul
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run i18n:generate-types
      - run: npm run i18n:check
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer
      - run: npm run build:electron
      - run: npm test

  sqlite-electron-probe:
    name: SQLite Electron probe (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # 完整 Electron 主进程探针（node:sqlite 内嵌于 Electron，无需原生绑定）；
      # 不得设置 ELECTRON_RUN_AS_NODE，必须以真实 Electron 应用启动。
      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite

  shell-contract:
    name: Shell lifecycle contract (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run i18n:generate-types
      - run: npm run test:shell-lifecycle
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer
