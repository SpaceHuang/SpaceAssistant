name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run i18n:generate-types
      - run: npm run i18n:check
      - run: npm run typecheck:shared
      - run: npm run typecheck:renderer
      - run: npm run build:electron
      - run: npm test

  sqlite-electron-probe:
    name: SQLite Electron probe (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # 完整 Electron 主进程探针（node:sqlite 内嵌于 Electron，无需原生绑定）；
      # 不得设置 ELECTRON_RUN_AS_NODE，必须以真实 Electron 应用启动。
      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite
