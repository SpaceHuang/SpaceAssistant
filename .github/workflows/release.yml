name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag points to a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag must point to a commit on the main branch."
            exit 1
          fi
          if ! git branch -r --contains "${GITHUB_SHA}" | grep -qE 'origin/main$'; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on main."

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - run: npm run i18n:generate-types
      - run: npm run i18n:check
      - run: node scripts/ripgrep-manifest.mjs
      - run: npm run build:agent-provider-pi-ai
      - name: Assert tests do not depend on ignored ripgrep staging
        shell: bash
        run: test -z "$(find resources/ripgrep -type f ! -name '.gitkeep' -print -quit)"
      - run: npm test
      # storage 延迟预算测量保留为每次发布的串行观测（advisory）：
      # 预算在 v0.2.5（4da925b1）就因未达标被改为 advisory，本次回归基线（92618867，分支合并前）
      # 与当前 HEAD 实测数字一致（multi-spill L1 ~290-330ms / cold-L1 search ~95-101ms，预算 50/20ms），
      # 证明是预算从未重校准而非读路径回归。重新校准（storage-profile 工作流）落地前不得阻断发布。
      - run: npm run test:storage-perf
        continue-on-error: true

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: win
            artifact_name: windows
          - os: macos-latest
            pack: mac
            artifact_name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build & pack
        shell: bash
        run: |
          if [ "${{ matrix.pack }}" = "win" ]; then npm run prepare:rg -- --target=win32-x64; else npm run prepare:rg -- --target=darwin-x64 --target=darwin-arm64; fi
          npm run build && npx electron-builder --${{ matrix.pack }} --publish never
        env:
          CI: true
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify macOS app signature
        if: matrix.pack == 'mac'
        run: |
          for APP in $(find release -type d -name '*.app' -prune -print); do
            npm run verify:macos-app -- "$APP"
          done
          test -n "$(find release -type d -name '*.app' -prune -print)"

      - name: Verify bundled ripgrep in unpacked outputs
        shell: bash
        run: |
          if [ "${{ matrix.pack }}" = "win" ]; then
            FOUND=0
            while IFS= read -r APP; do
              FOUND=1
              test -f "$APP/bin/rg.exe"
              npm run verify:rg:package -- "$(dirname "$APP")" win32-x64
            done < <(find release -type d -name 'resources' -print)
            test "$FOUND" -eq 1
          else
            FOUND=0
            while IFS= read -r APP; do
              FOUND=1
              test -x "$APP/Contents/Resources/bin/rg"
              npm run verify:rg:package -- "$APP"
            done < <(find release -type d -name '*.app' -prune -print)
            test "$FOUND" -eq 1
            test -n "$(find release -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          fi

      - name: Probe node:sqlite under Electron
        run: npm run probe:sqlite

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.pkg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
          if-no-files-found: error

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > /tmp/release-notes.md
          cat .github/release-appendix.md >> /tmp/release-notes.md

      - name: Prepare release assets
        run: |
          echo "Downloaded artifact tree:"
          find release-assets -type f | sort
          mkdir -p dist-release
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.pkg' \) -exec cp -v {} dist-release/ \;
          echo "Release assets:"
          ls -la dist-release
          test "$(find dist-release -type f | wc -l)" -ge 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: dist-release/*
          fail_on_unmatched_files: true
          overwrite_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
